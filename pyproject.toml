[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF", "LOG", "G", "PIE", "RET"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.music_assistant"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RET504", "RUF012"]
